<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIO · Reels</title>
<meta name="description" content="Reelurile pentru DIO, gata de postat.">
<meta name="theme-color" content="#09090c">
<style>
:root{--bg:#08080a;--card:#121217;--card2:#1a1a21;--card3:#22222b;--line:#24242d;--line2:#30303b;--text:#f2f2f6;--muted:#a0a0ae;--dim:#6a6a78;
  --accent:#facc15;--ink:#161200;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--tt:#ff2d55;--yt:#ff0033;--ig:#d62976;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 50% -240px,rgba(250,204,21,.09),transparent 62%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* antet */
.top{position:sticky;top:0;z-index:20;background:rgba(8,8,10,.82);backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#fde047,#facc15 55%,#eab308);color:var(--ink);font-weight:900;font-size:13px;letter-spacing:.3px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.2px}.brand small{color:var(--dim);font-size:12px}
.sp{flex:1}
.nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px}
.nav button{padding:7px 12px;border-radius:9px;font-weight:650;font-size:13px;color:var(--muted);white-space:nowrap}
.nav button em{font-style:normal;margin-left:6px;color:var(--dim);font-variant-numeric:tabular-nums}
.nav button.on{background:var(--card3);color:var(--text)}.nav button.on em{color:var(--accent)}
.soc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:18px 0 0}
.soc a{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.soc a:hover{color:var(--text)}
/* contorul de reels descărcate */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:0}
.stat b{display:block;font-size:28px;font-weight:850;letter-spacing:-.8px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--dim);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.main{background:linear-gradient(135deg,rgba(250,204,21,.16),rgba(250,204,21,.04));border-color:rgba(250,204,21,.35)}
.stat.main b{color:var(--accent)}
/* istoricul descărcărilor (evidență) */
.day{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;background:var(--card2);border-top:1px solid var(--line);font-size:12.5px;font-weight:750;color:var(--muted)}
.day:first-child{border-top:0}.day em{font-style:normal;color:var(--accent);text-transform:none}
.row .ph.none{display:grid;place-items:center;color:var(--dim);font-size:16px;background:var(--card3)}
.row .gone{font-size:12px;font-weight:650;color:var(--dim);white-space:nowrap}
/* bannerul de descărcare */
.banner{margin:18px 0 0;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.05));border:1px solid rgba(251,191,36,.35);color:#fde68a}
.banner b{color:#fff}
.banner .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(251,191,36,.2);flex:none;font-size:18px}
.banner .t{font-size:24px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
/* secțiuni */
section{margin:30px 0 0}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sh h2{margin:0;font-size:22px;letter-spacing:-.4px}
.sh span{color:var(--dim);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
/* card */
.reel{display:flex;flex-direction:column;gap:12px;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.player{position:relative;aspect-ratio:9/16;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 40px -26px #000}
.player video,.player img{width:100%;height:100%;object-fit:cover;display:block}
.player .pb{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:22px;color:#fff;padding-left:4px}
.player.on .pb,.player.on .tag,.player.on .len{opacity:0;pointer-events:none}
.tag,.len,.cdw{position:absolute;top:12px;font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 10px;border-radius:9px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;transition:opacity .2s}
.tag{left:12px;text-transform:uppercase}.len{right:12px;font-size:12px;letter-spacing:0}
.cdw{left:12px;right:12px;top:auto;bottom:12px;text-align:center;font-size:13px;letter-spacing:0;background:rgba(251,191,36,.92);color:#1a1300}
.nopv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;font-size:14px;padding:20px;background:linear-gradient(180deg,#15151c,#0b0b10)}
.title{font-weight:750;font-size:16.5px;line-height:1.3;letter-spacing:-.2px;padding:0 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--ink);font-weight:800;border-radius:12px;padding:12px;font-size:15px}
.dl:active{transform:scale(.98)}.dl small{font-weight:600;opacity:.65}
.dl.again{background:var(--card3);color:var(--text)}
details.txt summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:650;font-size:13.5px;color:var(--muted);padding:4px 4px}
details.txt summary::-webkit-details-marker{display:none}
details.txt summary::after{content:"＋";color:var(--dim)}details.txt[open] summary::after{content:"－"}
details.txt[open] summary{color:var(--text)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card2);padding:4px;border-radius:11px;margin-top:8px}
.tabs button{padding:7px 0;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:#0d0d12;color:var(--text)}
.tabs button[data-p=tt].on{box-shadow:inset 0 -2px 0 var(--tt)}.tabs button[data-p=yt].on{box-shadow:inset 0 -2px 0 var(--yt)}.tabs button[data-p=ig].on{box-shadow:inset 0 -2px 0 var(--ig)}
.field{background:#0d0d12;border:1px solid var(--line);border-radius:11px;padding:10px 12px;position:relative;margin-top:8px}
.field .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700;margin-bottom:4px}
.field .tx{white-space:pre-wrap;font-size:13.5px;color:#dcdce4;word-break:break-word;padding-right:66px}
.copy{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.copy.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{font-size:12px;padding:3px 8px;border-radius:7px;background:var(--card2);color:#c7c7d3}
.allcopy{font-size:12.5px;font-weight:700;color:var(--accent);margin-top:8px}
/* listă compactă (programate / descărcate mai demult) */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ph{width:44px;aspect-ratio:9/16;border-radius:8px;background:var(--card3) center/cover}
.row .t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--dim)}
.row a{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.when{display:inline-block;font-size:11.5px;font-weight:800;color:#c4b5fd;background:rgba(167,139,250,.12);padding:2px 8px;border-radius:7px;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);aspect-ratio:9/16}
@keyframes sh{to{background-position:-200% 0}}
footer{color:var(--dim);font-size:12.5px;text-align:center;padding:40px 0 50px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#f4f4f5;color:#111;font-weight:700;padding:12px 18px;border-radius:14px;opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 20px 50px -20px #000}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:720px){.stats{gap:8px}.stat{padding:10px 12px}.stat b{font-size:24px}.stat span{white-space:normal;font-size:11.5px;line-height:1.3}.top .wrap{flex-wrap:wrap;padding-top:10px;padding-bottom:10px}.nav{order:3;width:100%;overflow-x:auto}.grid{grid-template-columns:1fr}.banner{flex-wrap:wrap}.banner .t{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="logo">DIO</div><div class="brand"><b>Reels DIO</b><small id="upd">se încarcă…</small></div>
  <div class="sp"></div>
  <nav class="nav" id="nav"></nav>
</div></div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div id="banner"></div>
  <main id="main"><section><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section></main>
  <div class="soc" id="socials"></div>
  <footer>Reelurile descărcate dispar automat de pe site la 90 de minute după descărcare. · Se actualizează singur.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const REPO="aman-andrei-portfolio/dio-shorts", SOCIALS=[{"name": "Kick", "handle": "@dio-official", "url": "https://kick.com/dio-official"}, {"name": "Discord", "handle": "@DIO HUB", "url": "https://discord.gg/ZsY2G9gy43"}, {"name": "TikTok", "handle": "@dio.offiicial", "url": "https://www.tiktok.com/@dio.offiicial"}, {"name": "Instagram", "handle": "@dio_offiicial", "url": "https://www.instagram.com/dio_offiicial/"}], EXPIRE_MIN=+"90"||0;
const TYPES={amuzant:'Amuzant',reactie:'Reacție',epic:'Epic',din_suflet:'Din suflet',motivational:'Motivațional',wholesome:'Wholesome',dezbatere:'Discuție'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL=[],VIEW=(location.hash||'#nou').slice(1),DONE={},ITEMS={};
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms||2200)}
function today(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function niceDate(d){const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd),t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((t-dt)/864e5);if(diff===0)return'Azi';if(diff===1)return'Ieri';if(diff===-1)return'Mâine';
  return dt.toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short'})}
function mb(b){return b?(b/1048576).toFixed(0)+' MB':''}
function parse(body){const m=/<!--DIO-DATA\s*([\s\S]*?)\s*DIO-DATA-->/.exec(body||'');try{return m?JSON.parse(m[1]):[]}catch(e){return[]}}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function cd(ms){const s=Math.max(0,Math.round((ms-Date.now())/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
// descărcat = contorul GitHub (vine cu o mică întârziere) sau apăsat aici, pe acest telefon / calculator
function expiry(r){if(r.keep)return null;if(r.expires_at)return r.expires_at;const got=(ls('got')||{})[r.id];
  if(!got||!EXPIRE_MIN||Date.now()-got>10*60000)return null;  // neconfirmat de server în 10 min → nu-l mai arăt ca descărcat
  return got+EXPIRE_MIN*60000}
function state(r){const ex=expiry(r);if(ex)return ex>Date.now()?'soon':'gone';if(r.dl>0)return 'old';return r.date>today()?'later':'new'}

async function load(first){
  if(first)$('socials').innerHTML=SOCIALS.map(s=>`<a href="${esc(s.url||'#')}" target="_blank" rel="noopener">${esc(s.name)} · ${esc(s.handle)}</a>`).join('');
  let rel=null;
  try{const r=await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=60`,{cache:'no-store'});if(!r.ok)throw 0;rel=await r.json();ls('rel',{t:Date.now(),rel})}
  catch(e){const c=ls('rel');rel=c?c.rel:[]}
  ALL=[];(rel||[]).filter(r=>r.tag_name&&r.tag_name.startsWith('zi-')).forEach(r=>{const dl={};(r.assets||[]).forEach(a=>dl[a.browser_download_url]=a.download_count||0);
    parse(r.body).forEach(x=>ALL.push({...x,date:r.tag_name.slice(3),dl:Math.max(0,(dl[x.video]||0)-(x.dl_base||0))}))});
  try{const r=await fetch('stats.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();DONE=j.downloaded||{};ITEMS=j.items||{};ls('stats2',{d:DONE,i:ITEMS})}}
  catch(e){const c=ls('stats2')||{};DONE=c.d||{};ITEMS=c.i||{}}
  $('upd').textContent='actualizat '+new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
  draw()}
function groups(){const g={new:[],soon:[],later:[],old:[]};ALL.forEach(r=>{const s=state(r);if(g[s])g[s].push(r)});
  g.new.sort((a,b)=>b.date.localeCompare(a.date));g.soon.sort((a,b)=>expiry(a)-expiry(b));g.later.sort((a,b)=>a.date.localeCompare(b.date));g.old.sort((a,b)=>b.date.localeCompare(a.date));return g}
function draw(){const g=groups();stats();
  if(!['nou','descarcate','programate'].includes(VIEW))VIEW='nou';
  $('nav').innerHTML=[['nou','De descărcat',g.new.length],['descarcate','Descărcate',Object.keys(allDone()).length],['programate','Programate',g.later.length]]
    .map(([k,l,n])=>`<button class="${VIEW===k?'on':''}" onclick="go('${k}')">${l}<em>${n}</em></button>`).join('');
  $('banner').innerHTML=g.soon.length?`<div class="banner"><div class="ic">⏳</div><div><b>${g.soon.length===1?'Ai descărcat un reel.':`Ai descărcat ${g.soon.length} reels.`}</b> Postează-${g.soon.length===1?'l':'le'} acum: ${g.soon.length===1?'dispare':'dispar'} de pe site după ${EXPIRE_MIN} de minute de la descărcare.</div><div class="t" data-exp="${expiry(g.soon[0])}">${cd(expiry(g.soon[0]))}</div></div>`:'';
  let h='';
  if(VIEW==='nou'){h+=`<section><div class="sh"><h2>De descărcat</h2><span>${g.new.length} ${g.new.length===1?'reel nou':'reels noi'} · după descărcare ${EXPIRE_MIN?`dispar în ${EXPIRE_MIN} min`:'rămân'}</span></div>`+
      (g.new.length?`<div class="grid">${g.new.map((r,i)=>card(r,i)).join('')}</div>`:`<div class="empty"><b>Le-ai luat pe toate 🎉</b>Reelurile noi apar aici singure.</div>`)+`</section>`;
    if(g.soon.length)h+=`<section><div class="sh"><h2>Descărcate · dispar curând</h2><span>postează-le până expiră</span></div><div class="grid">${g.soon.map((r,i)=>card(r,i+100)).join('')}</div></section>`}
  if(VIEW==='descarcate'){h+=g.soon.length?`<section><div class="sh"><h2>Dispar curând</h2><span>${g.soon.length}</span></div><div class="grid">${g.soon.map((r,i)=>card(r,i)).join('')}</div></section>`:'';
    const hh=history();h+=`<section><div class="sh"><h2>Toate descărcările</h2><span>${hh.length} ${hh.length===1?'reel':'reels'} în total · evidență pe zile</span></div>${hist(hh)}</section>`}
  if(VIEW==='programate')h+=`<section><div class="sh"><h2>Programate</h2><span>apar în zilele următoare</span></div>${g.later.length?list(g.later,true):`<div class="empty"><b>Nimic programat</b>Reelurile pentru zilele următoare apar aici.</div>`}</section>`;
  $('main').innerHTML=h}
// contorul: toate reelurile descărcate vreodată (și cele scoase deja de pe site) + cele de acum
function allDone(){const all={...DONE};ALL.forEach(r=>{if(r.dl>0&&!all[r.id])all[r.id]=r.downloaded_at||Date.now()});return all}
// tot ce a descărcat vreodată, cel mai nou primul (și cele scoase deja de pe site: rămân în evidență)
function history(){const on={};ALL.forEach(r=>on[r.id]=r);
  return Object.entries(allDone()).map(([id,t])=>{const r=on[id],m=ITEMS[id]||{};
    return {id,t:+t,r,approx:!!m.approx&&!(r&&r.downloaded_at),title:(r&&r.title)||m.title||'Reel',type:(r&&r.type)||m.type,duration:(r&&r.duration)||m.duration}})
    .sort((a,b)=>(a.approx-b.approx)||(b.t-a.t))}
function hist(h){if(!h.length)return `<div class="empty"><b>Nimic aici</b>Reelurile descărcate apar aici.</div>`;
  const dk=x=>{if(x.approx)return'~';const d=new Date(x.t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()},cnt={};h.forEach(x=>{const k=dk(x);cnt[k]=(cnt[k]||0)+1});
  const up=t=>t.charAt(0).toUpperCase()+t.slice(1),until=Math.max(0,...h.filter(x=>x.approx).map(x=>x.t));
  let out='',last='';h.forEach(x=>{const k=dk(x);
    if(k!==last){last=k;const lbl=x.approx?`Până pe ${new Date(until).toLocaleDateString('ro-RO',{day:'numeric',month:'long'})} · data exactă nu se știe`
        :up(new Date(x.t).toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'}));
      out+=`<div class="day"><span>${esc(lbl)}</span><em>${cnt[k]} ${cnt[k]===1?'reel':'reels'}</em></div>`}
    const r=x.r,hr=x.t&&!x.approx?new Date(x.t).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}):'';
    out+=`<div class="row">${r&&r.poster?`<div class="ph" style="background-image:url('${esc(r.poster)}')"></div>`:`<div class="ph none">✓</div>`}
      <div style="min-width:0"><div class="t">${esc(x.title)}</div><div class="s">${[TYPES[x.type]||x.type,x.duration?Math.round(x.duration)+'s':'',hr&&'descărcat la '+hr].filter(Boolean).map(esc).join(' · ')}</div></div>
      ${r?`<a href="${esc(r.video)}" download onclick="got('${esc(r.id)}')">⬇ ${mb(r.size)}</a>`:`<span class="gone">scos de pe site</span>`}</div>`});
  return `<div class="list">${out}</div>`}
function stats(){const all=allDone();
  const ts=Object.values(all),now=new Date(),wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),n=ts.length,w=ts.filter(t=>t>=wk.getTime()).length,m=ts.filter(t=>t>=d0).length;
  const fmt=x=>x.toLocaleString('ro-RO');
  $('stats').innerHTML=`<div class="stat main"><b>${fmt(n)}</b><span>${n===1?'reel descărcat':'reels descărcate'}</span></div>`+
    `<div class="stat"><b>${fmt(m)}</b><span>azi</span></div><div class="stat"><b>${fmt(w)}</b><span>săptămâna asta</span></div>`}
function go(v){VIEW=v;history.replaceState(null,'','#'+v);draw();window.scrollTo({top:0,behavior:'smooth'})}
function list(rs,sched){return `<div class="list">${rs.map(r=>`<div class="row"><div class="ph" style="background-image:url('${esc(r.poster||'')}')"></div>
  <div style="min-width:0"><div class="t">${sched?`<span class="when">${esc(niceDate(r.date))}</span>`:''}${esc(r.title)}</div><div class="s">${esc(TYPES[r.type]||r.type||'')}${r.duration?' · '+Math.round(r.duration)+'s':''}${r.dl?` · descărcat ${r.dl}×`:''}</div></div>
  <a href="${esc(r.video)}" download onclick="got('${esc(r.id)}')">⬇ ${mb(r.size)}</a></div>`).join('')}</div>`}
function card(r,i){
  const ex=expiry(r),tt=r.tiktok_caption||'',ig=r.instagram_caption||'';
  return `<article class="reel" style="animation-delay:${Math.min(i%100,8)*.06}s">
    <div class="player" onclick="play(this,'${esc(r.preview||'')}')">${r.poster?`<img src="${esc(r.poster)}" alt="" loading="lazy">`:r.preview?`<video src="${esc(r.preview)}#t=0.5" preload="metadata" muted playsinline></video>`:`<div class="nopv">Previzualizarea a expirat.<br>Video-ul se poate descărca mai jos.</div>`}
      ${r.preview?'<span class="pb">▶</span>':''}${r.type?`<span class="tag">${esc(TYPES[r.type]||r.type)}</span>`:''}${r.duration?`<span class="len">${Math.round(r.duration)}s</span>`:''}
      ${ex?`<span class="cdw">⏳ dispare în <b data-exp="${ex}">${cd(ex)}</b></span>`:''}</div>
    <div class="title">${esc(r.title)}</div>
    <div class="box">
      <a class="dl ${ex?'again':''}" href="${esc(r.video)}" download onclick="got('${esc(r.id)}')">⬇ ${ex?'Descarcă din nou':'Descarcă video'} <small>${mb(r.size)}</small></a>
      <details class="txt"><summary>Text pentru postare</summary>
        <div class="tabs" id="t${i}"><button data-p="tt" class="on" onclick="tab(${i},'tt')">TikTok</button><button data-p="yt" onclick="tab(${i},'yt')">YouTube</button><button data-p="ig" onclick="tab(${i},'ig')">Instagram</button></div>
        <div id="p${i}">${field(tt,'Descriere TikTok')}</div>
        <div class="chips">${(r.hashtags||[]).map(h=>`<span class="chip">${esc(h)}</span>`).join('')}</div>
        ${(r.hashtags||[]).length?`<button class="allcopy" data-c="${esc((r.hashtags||[]).join(' '))}" onclick="cp(this)">Copiază toate hashtag-urile</button>`:''}
        <script type="application/json" id="d${i}">${JSON.stringify({tt,ig,ytt:r.yt_title||'',ytd:r.yt_description||''}).replace(/</g,'\\u003c')}<\/script>
      </details></div></article>`}
function play(el,src){if(!src||el.classList.contains('on'))return;el.classList.add('on');el.querySelectorAll('img,video').forEach(x=>x.remove());
  const v=document.createElement('video');v.src=src;v.controls=true;v.playsInline=true;v.autoplay=true;el.prepend(v);
  document.querySelectorAll('.player video').forEach(o=>{if(o!==v)o.pause()})}
function got(id){const g=ls('got')||{};if(!g[id]){g[id]=Date.now();ls('got',g)}
  if(EXPIRE_MIN)toast(`Descărcarea a pornit. Reelul dispare de pe site în ${EXPIRE_MIN>=60?Math.floor(EXPIRE_MIN/60)+' h'+(EXPIRE_MIN%60?' '+EXPIRE_MIN%60+' min':''):EXPIRE_MIN+' min'}: postează-l până atunci.`,5200);
  setTimeout(draw,400)}
function field(text,label){return `<div class="field"><div class="lbl">${esc(label)}</div><div class="tx">${esc(text)}</div><button class="copy" data-c="${esc(text)}" onclick="cp(this)">Copiază</button></div>`}
function tab(i,p){const d=JSON.parse($('d'+i).textContent);document.querySelectorAll(`#t${i} button`).forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('p'+i).innerHTML=p==='yt'?field(d.ytt,'Titlu YouTube')+field(d.ytd,'Descriere YouTube'):field(p==='tt'?d.tt:d.ig,p==='tt'?'Descriere TikTok':'Descriere Instagram')}
async function cp(b){const t=b.dataset.c;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  b.classList.add('ok');const o=b.textContent;b.textContent='Copiat ✓';toast('Copiat');setTimeout(()=>{b.classList.remove('ok');b.textContent=o},1500)}
setInterval(()=>{let need=false;document.querySelectorAll('[data-exp]').forEach(e=>{const ms=+e.dataset.exp;if(ms<=Date.now())need=true;e.textContent=cd(ms)});if(need)draw()},1000);
setInterval(()=>{if(!document.hidden)load()},180000);  // GitHub dă 60 de cereri pe oră fără cont → la 3 minute
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load(true);
</script>
</body>
</html>
