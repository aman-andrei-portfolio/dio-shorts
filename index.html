<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIO · Reels</title>
<meta name="description" content="Reelurile zilei pentru DIO, gata de postat.">
<meta name="theme-color" content="#09090c">
<style>
:root{--bg:#09090c;--card:#121218;--card2:#191920;--line:#25252f;--text:#f2f2f6;--muted:#9696a6;--dim:#62626f;--accent:#facc15;--ink:#161200;
  --tt:#ff2d55;--yt:#ff0033;--ig:#d62976;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 50% -200px,rgba(250,204,21,.10),transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
header{padding:34px 0 10px;text-align:center}
.logo{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--ink);font-weight:900;font-size:20px;letter-spacing:.5px;box-shadow:0 10px 40px rgba(250,204,21,.25)}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-1px;margin:16px 0 6px;line-height:1.05}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:0 auto;max-width:520px}
.socials{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.socials a{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.socials a:hover{color:var(--text)}
.days{display:flex;gap:8px;overflow-x:auto;padding:22px 2px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.day.on{background:var(--text);color:#0b0b0f;border-color:var(--text)}
.day small{font-weight:500;opacity:.7;margin-left:6px}
.head{display:flex;align-items:baseline;gap:12px;margin:18px 0 16px;flex-wrap:wrap}
.head h2{margin:0;font-size:22px;letter-spacing:-.3px}
.head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:60px}
.reel{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
  animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.player{position:relative;aspect-ratio:9/16;background:#000}
.player video{width:100%;height:100%;object-fit:cover;display:block}
.nopv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;font-size:14px;padding:20px;background:linear-gradient(180deg,#15151c,#0b0b10)}
.nopv b{font-size:40px;color:var(--dim)}
.tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff}
.len{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.body{padding:16px;display:flex;flex-direction:column;gap:12px}
.title{font-weight:750;font-size:17px;line-height:1.3;letter-spacing:-.2px}
.views{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.views b{color:var(--text);font-size:14px;margin-right:4px}
.views .vp{padding:3px 8px;border-radius:7px;background:var(--card2)}
.views .vp.yt{box-shadow:inset 2px 0 0 var(--yt)}.views .vp.tt{box-shadow:inset 2px 0 0 #25f4ee}.views .vp.ig{box-shadow:inset 2px 0 0 var(--ig)}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--ink);font-weight:800;border-radius:14px;padding:13px;font-size:15px}
.dl:active{transform:scale(.98)}
.dl small{font-weight:600;opacity:.7}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card2);padding:4px;border-radius:12px}
.tabs button{padding:8px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:#0d0d12;color:var(--text)}
.tabs button[data-p=tt].on{box-shadow:inset 0 -2px 0 var(--tt)}
.tabs button[data-p=yt].on{box-shadow:inset 0 -2px 0 var(--yt)}
.tabs button[data-p=ig].on{box-shadow:inset 0 -2px 0 var(--ig)}
.field{background:#0d0d12;border:1px solid var(--line);border-radius:12px;padding:11px 12px;position:relative}
.field .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700;margin-bottom:4px}
.field .txt{white-space:pre-wrap;font-size:14px;color:#dcdce4;word-break:break-word;padding-right:64px}
.copy{position:absolute;top:9px;right:9px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.copy.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--card2);color:#c7c7d3}
.allcopy{font-size:12.5px;font-weight:700;color:var(--accent);align-self:flex-start}
.empty{text-align:center;color:var(--muted);padding:70px 20px;border:1px dashed var(--line);border-radius:22px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:22px;aspect-ratio:9/16}
@keyframes sh{to{background-position:-200% 0}}
footer{color:var(--dim);font-size:12.5px;text-align:center;padding:10px 0 40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#f4f4f5;color:#111;font-weight:700;padding:11px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:0 14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">DIO</div>
    <h1>Reelurile <span>zilei</span></h1>
    <p class="lead">Gata de postat pe TikTok, YouTube Shorts și Instagram. Descarcă video-ul, copiază textul pentru platformă și postează.</p>
    <div class="socials" id="socials"></div>
  </header>
  <nav class="days" id="days"></nav>
  <main id="main"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>
  <footer>Actualizat automat · <span id="upd"></span></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const REPO="aman-andrei-portfolio/dio-shorts", SOCIALS=[{"name": "Kick", "handle": "@dio-official", "url": "https://kick.com/dio-official"}, {"name": "Discord", "handle": "@DIO HUB", "url": "https://discord.gg/ZsY2G9gy43"}, {"name": "TikTok", "handle": "@dio.offiicial", "url": "https://www.tiktok.com/@dio.offiicial"}, {"name": "Instagram", "handle": "@dio_offiicial", "url": "https://www.instagram.com/dio_offiicial/"}];
const TYPES={amuzant:'Amuzant',reactie:'Reacție',epic:'Epic',din_suflet:'Din suflet',motivational:'Motivațional',wholesome:'Wholesome'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DAYS=[], cur=null;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function niceDate(d){const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd),t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((t-dt)/864e5);if(diff===0)return'Azi';if(diff===1)return'Ieri';
  return dt.toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short'})}
function kf(n){if(n==null)return '—';if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return (n/1e3).toFixed(1).replace('.0','')+'K';return String(n)}
function mb(b){return b?(b/1048576).toFixed(0)+' MB':''}
function parse(body){const m=/<!--DIO-DATA\s*([\s\S]*?)\s*DIO-DATA-->/.exec(body||'');try{return m?JSON.parse(m[1]):[]}catch(e){return[]}}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

async function load(){
  $('socials').innerHTML=SOCIALS.map(s=>`<a href="${esc(s.url||'#')}" target="_blank" rel="noopener">${esc(s.name)} · ${esc(s.handle)}</a>`).join('');
  let rel=null;
  try{const r=await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=60`,{cache:'no-store'});if(!r.ok)throw 0;rel=await r.json();lsSet('rel',{t:Date.now(),rel})}
  catch(e){const c=lsGet('rel');rel=c?c.rel:[]}
  DAYS=(rel||[]).filter(r=>r.tag_name&&r.tag_name.startsWith('zi-')).map(r=>({date:r.tag_name.slice(3),reels:parse(r.body)})).filter(d=>d.reels.length).sort((a,b)=>b.date.localeCompare(a.date));
  $('upd').textContent=new Date().toLocaleString('ro-RO',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
  const want=location.hash.slice(1);cur=DAYS.find(d=>d.date===want)?want:DAYS[0]?.date;draw();
}
function draw(){
  $('days').innerHTML=DAYS.map(d=>`<button class="day ${d.date===cur?'on':''}" onclick="pick('${d.date}')">${niceDate(d.date)}<small>${d.reels.length}</small></button>`).join('');
  const d=DAYS.find(x=>x.date===cur);
  if(!d){$('main').innerHTML=`<div class="empty"><b>Încă nu sunt reels</b>Revino mai târziu, apar aici automat.</div>`;return}
  const [y,m,dd]=d.date.split('-');
  $('main').innerHTML=`<div class="head"><h2>${niceDate(d.date)}</h2><span>${dd}.${m}.${y} · ${d.reels.length} ${d.reels.length===1?'reel':'reels'}</span></div>
   <div class="grid">${d.reels.map((r,i)=>card(r,i)).join('')}</div>`;
}
function pick(d){cur=d;history.replaceState(null,'','#'+d);draw();window.scrollTo({top:0,behavior:'smooth'})}
function card(r,i){
  const tt=r.tiktok_caption||'',yt=(r.yt_title||'')+'\n\n'+(r.yt_description||''),ig=r.instagram_caption||'';
  return `<article class="reel" style="animation-delay:${i*.08}s">
    <div class="player">${r.preview?`<video src="${esc(r.preview)}" ${r.poster?`poster="${esc(r.poster)}"`:''} controls playsinline preload="metadata"></video>`
      :`<div class="nopv"><b>▶</b>Previzualizarea a expirat.<br>Video-ul se poate descărca mai jos.</div>`}
      ${r.type?`<span class="tag">${esc(TYPES[r.type]||r.type)}</span>`:''}${r.duration?`<span class="len">${Math.round(r.duration)}s</span>`:''}</div>
    <div class="body">
      <div class="title">${esc(r.title)}</div>
      ${r.views&&r.views.total?`<div class="views"><b>👁 ${kf(r.views.total)}</b>${['yt','tt','ig'].filter(k=>r.views[k]!=null).map(k=>`<span class="vp ${k}">${({yt:'YouTube',tt:'TikTok',ig:'Instagram'})[k]} ${kf(r.views[k])}</span>`).join('')}</div>`:''}
      <a class="dl" href="${esc(r.video)}" download>⬇ Descarcă video <small>${mb(r.size)}</small></a>
      <div class="tabs" id="t${i}">
        <button data-p="tt" class="on" onclick="tab(${i},'tt')">TikTok</button>
        <button data-p="yt" onclick="tab(${i},'yt')">YouTube</button>
        <button data-p="ig" onclick="tab(${i},'ig')">Instagram</button></div>
      <div id="p${i}">${field(tt,'Descriere TikTok')}</div>
      <div class="chips">${(r.hashtags||[]).map(h=>`<span class="chip">${esc(h)}</span>`).join('')}</div>
      <button class="allcopy" data-c="${esc((r.hashtags||[]).join(' '))}" onclick="cp(this)">Copiază toate hashtag-urile</button>
      <script type="application/json" id="d${i}">${JSON.stringify({tt,yt,ig,ytt:r.yt_title||'',ytd:r.yt_description||''}).replace(/</g,'\\u003c')}<\/script>
    </div></article>`;
}
function field(text,label){return `<div class="field"><div class="lbl">${esc(label)}</div><div class="txt">${esc(text)}</div><button class="copy" data-c="${esc(text)}" onclick="cp(this)">Copiază</button></div>`}
function tab(i,p){const d=JSON.parse($('d'+i).textContent);document.querySelectorAll(`#t${i} button`).forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('p'+i).innerHTML=p==='yt'?field(d.ytt,'Titlu YouTube')+'<div style="height:8px"></div>'+field(d.ytd,'Descriere YouTube'):field(p==='tt'?d.tt:d.ig,p==='tt'?'Descriere TikTok':'Descriere Instagram')}
async function cp(b){const t=b.dataset.c;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  b.classList.add('ok');const o=b.textContent;b.textContent='Copiat ✓';toast('Copiat');setTimeout(()=>{b.classList.remove('ok');b.textContent=o},1500)}
load();
</script>
</body>
</html>
